name: TeamTaskManagement CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore TeamTaskManagement.sln

      - name: Build Solution
        run: dotnet build TeamTaskManagement.sln --configuration Release --no-restore

      - name: Run Tests
        run: dotnet test TeamTaskManagement.sln --configuration Release --no-build